# AXION Phase 1 — protocol + harness defaults
seed: 111
seeds: [111, 222, 333, 444, 555]

paths:
  adbench_root: ../../ADBench/adbench/datasets
  results_dir: results
  atlas_csv: data/atlas_57.csv

protocol:
  # Paper-faithful (AnoDDAE / Livernoche) — DO NOT use ADBench DataGenerator
  normalize: zscore  # fit on train only
  unsupervised: full_dataset_train_and_score
  semi_supervised: train_50pct_normals_only
  metrics: [PR-AUC, ROC-AUC]
  embeddings:
    cv: CV_by_ResNet18
    nlp: NLP_by_BERT

integrity:
  val_fraction: 0.2
  early_stop_metric: val_loss
  # never select on test PR

harness:
  # Default ship model is AXION. centroid_distance remains for wiring tests.
  model: axion
  max_train_samples: 20000  # cap large tables (cover/fraud/backdoor/…)
  max_variants: 0  # 0 = all NPZ variants; set 2–3 for fast design loops

axion:
  epochs: 70
  batch_size: 256
  lr: 0.001
  weight_decay: 0.00001
  patience: 15
  val_fraction: 0.15
  # v1-balanced defaults (G2 latch=0.55/mae=0.75 hurt semi)
  latch_alpha: 0.40
  latch_alpha_semi: 0.25
  mae_weight: 0.60
  nll_weight: 0.40
  # hidden/latent/depth/mask_rates/score_k: null → SCALE auto

probe:
  # Locked diversity set for G2 (Phase 2+)
  datasets:
    - breastw
    - cardio
    - glass
    - thyroid
    - satimage-2
    - cover
    - fraud
    - backdoor
    - CIFAR10
    - FashionMNIST
    - Agnews
    - Imdb
  seeds: [111, 222, 333]
