# AdaDDAE-2 smoke (few epochs) — integrity checks for advanced stack
seed: 111
seeds: [111, 222]

paths:
  adbench_root: ../ADBench/adbench/datasets
  results_dir: results/adadae2_final_smoke
  run_id: adadae2_final_smoke

train:
  setting: semi-supervised
  lr: 0.001
  epochs: 8
  eval_every: 2
  early_stop_patience: 6
  val_fraction: 0.2
  early_stop_metric: val_loss
  contrastive: true
  contrastive_alpha: 0.15
  contrastive_alpha_unsupervised: 0.05
  hard_negative_mining: true
  contrastive_gamma: 1.0
  contrastive_adaptive_alpha: true

model:
  hidden_dims: [256, 256]
  latent_dim: 16
  activation: lrelu

diffusion:
  num_timesteps: 30
  beta_start: 0.0001
  beta_end: 0.02
  scheduler: linear
  time_emb_dim: 8
  time_emb_type: sinusoidal

adadae:
  policy: static
  use_danc: true
  use_chronos: true
  use_scs: true
  use_ftp: true
  use_multiview: true
  scs_max_timesteps: 16
  scs_mode: snr_weighted
  scs_selection: snr_stratified
  danc_contamination_mode: label_free
  contrastive_pairing: taps
  use_uncertainty_view: false
  use_dte_view: true
  dte_knn: 5
  dte_memory_size: 1024
  use_rejection_training: true
  use_geode: true
  geode_neighbors: 16
  geode_components: 3
  use_aether: true
  aether_loss_weight: 0.05
  use_nexus: true
  nexus_loss_weight: 0.02
  fusion_mode: calix
  use_mce: false
  use_gate: false
  fusion_weights:
    reconstruction: 0.35
    latent: 0.15
    residual: 0.1
    diffusion_time: 0.15
    geode: 0.15
    aether: 0.1

features:
  scaler: auto
  pca_dim_threshold: 128
  pca_max_components: 64
  pca_variance: 0.95
  clip_outliers: true
  clip_sigma: 5.0

hardware: hardware_cpu.yaml
