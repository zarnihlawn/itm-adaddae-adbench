# Primary thesis recipe: ONE frozen AdaDDAE for all 57 datasets.
# No per-dataset routing, exceptions, MCE/GATE/SMC patches, or guarded merge.
# Early stop / checkpoint on train-carved validation loss only; test scored once.
seed: 111
seeds: [111, 222, 333, 444, 555]

paths:
  adbench_root: ../ADBench/adbench/datasets
  results_dir: results/adadae_final
  run_id: adadae_final

train:
  setting: semi-supervised
  lr: 0.001
  epochs: 100
  eval_every: 10
  early_stop_patience: 30
  val_fraction: 0.2
  early_stop_metric: val_loss
  contrastive: true
  contrastive_alpha: 0.15
  contrastive_alpha_unsupervised: 0.05
  hard_negative_mining: true
  contrastive_gamma: 1.0
  contrastive_adaptive_alpha: true

model:
  hidden_dims: [512, 512]
  latent_dim: 32
  activation: lrelu

diffusion:
  num_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  scheduler: linear
  time_emb_dim: 4
  time_emb_type: sinusoidal

adadae:
  # Static = apply_routed_config is a no-op (see src/policy.py)
  policy: static
  use_danc: true
  use_scs: true
  use_ftp: true
  use_multiview: true
  scs_max_timesteps: 64
  scs_mode: snr_weighted
  scs_selection: snr_stratified
  scs_full_sum_ablation: false
  danc_contamination_mode: label_free
  contrastive_pairing: taps
  use_uncertainty_view: true
  uncertainty_draws: 3
  use_dte_view: true
  dte_knn: 5
  dte_memory_size: 4096
  dte_knn_weight: 0.5
  use_rejection_training: true
  rejection_quantile: 0.95
  rejection_min_weight: 0.1
  rejection_warmup_epochs: 1
  fusion_mode: calibrated
  # Primary path: off (appendix / development only)
  use_mce: false
  use_gate: false
  fusion_weights:
    reconstruction: 0.45
    latent: 0.2
    residual: 0.1
    uncertainty: 0.1
    diffusion_time: 0.15

features:
  scaler: auto
  pca_dim_threshold: 128
  pca_max_components: 128
  pca_variance: 0.95
  clip_outliers: true
  clip_sigma: 5.0

hardware: hardware_rtx5070ti.yaml
