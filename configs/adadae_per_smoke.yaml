# AdaDDAE-PER smoke — short epochs, same policy wiring as full PER.
seed: 111
seeds: [111, 222]

paths:
  adbench_root: ../ADBench/adbench/datasets
  results_dir: results/adadae_per_smoke
  run_id: adadae_per_smoke

train:
  setting: semi-supervised
  lr: 0.001
  epochs: 3
  eval_every: 1
  early_stop_patience: 2
  val_fraction: 0.2
  early_stop_metric: val_loss
  contrastive: false
  contrastive_alpha: 0.0
  hard_negative_mining: false

model:
  hidden_dims: [512, 512]
  latent_dim: 32
  activation: lrelu

diffusion:
  num_timesteps: 20
  beta_start: 0.0001
  beta_end: 0.02
  scheduler: linear
  time_emb_dim: 8
  time_emb_type: sinusoidal

adadae:
  policy: per
  exceptions_file: configs/adadae_per_exceptions.yaml
  upgrades_file: configs/adadae_per_upgrades.yaml
  use_danc: true
  use_scs: true
  use_ftp: true
  use_multiview: false
  scs_max_timesteps: 20
  scs_mode: snr_weighted
  scs_selection: snr_stratified
  danc_contamination_mode: label_free
  danc_t_min: 5
  use_uncertainty_view: false
  use_dte_view: false
  use_rejection_training: false
  use_mce: false
  use_gate: false
  fusion_mode: fixed
  fusion_weights:
    reconstruction: 1.0
    latent: 0.0
    residual: 0.0
    uncertainty: 0.0
    diffusion_time: 0.0

features:
  scaler: auto
  pca_dim_threshold: 128
  pca_max_components: 128
  pca_variance: 0.95
  clip_outliers: true
  clip_sigma: 5.0

hardware: hardware_rtx5070ti.yaml
