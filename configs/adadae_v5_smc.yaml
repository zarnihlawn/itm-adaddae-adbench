# AdaDDAE v5 SMC track: SNR-calibrated fusion on semi tails
seed: 111
seeds: [111, 222, 333, 444, 555]

paths:
  adbench_root: ../ADBench/adbench/datasets
  results_dir: results/adadae_v51_smc
  run_id: adadae_v51_smc

train:
  setting: semi-supervised
  lr: 0.001
  epochs: 100
  eval_every: 10
  early_stop_patience: 20
  contrastive: true
  contrastive_alpha: 0.15
  contrastive_alpha_unsupervised: 0.05
  hard_negative_mining: true

model:
  hidden_dims: [512, 512]
  latent_dim: 32
  activation: lrelu

diffusion:
  num_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  scheduler: linear
  time_emb_dim: 8
  time_emb_type: sinusoidal

adadae:
  policy: routed
  fusion_mode: smc
  use_multiview: true
  use_dte_view: true
  use_uncertainty_view: false
  use_rejection_training: true
  exceptions_file: configs/policy_exceptions.yaml

features:
  scaler: auto
  pca_dim_threshold: 128
  pca_max_components: 128
  pca_variance: 0.95
  clip_outliers: true
  clip_sigma: 5.0

hardware: hardware_rtx5070_12g.yaml
