seed: 111
seeds: [111, 222, 333, 444, 555]

paths:
  adbench_root: ../ADBench/adbench/datasets
  results_dir: results
  run_id: adadae_default

train:
  setting: semi-supervised  # unsupervised | semi-supervised
  lr: 0.001
  epochs: 100
  eval_every: 10
  early_stop_patience: 20
  # Unsupervised: lighter contrastive (paper found DDAE > DDAE-C unsupervised)
  contrastive: true
  contrastive_alpha: 0.1
  hard_negative_mining: true
  contrastive_alpha_unsupervised: 0.05

model:
  hidden_dims: [512, 512]
  latent_dim: 32
  activation: lrelu

diffusion:
  # overridden by DANC when enabled
  num_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  scheduler: linear
  time_emb_dim: 8
  time_emb_type: sinusoidal

adadae:
  use_danc: true
  use_scs: true
  use_ftp: true
  use_multiview: true
  scs_max_timesteps: 32
  scs_mode: snr_weighted
  scs_selection: snr_stratified
  danc_contamination_mode: label_free
  contrastive_pairing: taps
  use_uncertainty_view: false
  uncertainty_draws: 3
  use_dte_view: true
  dte_knn: 5
  use_rejection_training: true
  rejection_quantile: 0.95
  rejection_min_weight: 0.1
  rejection_warmup_epochs: 1
  fusion_mode: fixed
  fusion_weights:
    reconstruction: 0.55
    latent: 0.25
    residual: 0.1
    uncertainty: 0.0
    diffusion_time: 0.1

features:
  # FTP defaults; refined per-dataset in code
  scaler: auto  # auto | standard | robust
  pca_dim_threshold: 128
  pca_max_components: 128
  pca_variance: 0.95
  clip_outliers: true
  clip_sigma: 5.0

hardware: hardware_cpu.yaml
