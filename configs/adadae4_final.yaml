# AdaDDAE-4 frozen recipe (Table 4) — regime-aware, one YAML for all 57.
# OMNI + NANO/TORRENT/PRISM/POLIS/SIEVE/QUELL/ROBUST (meta-gated) +
# CHRONOS + GEODE + AETHER + HELIOS/KAIROS keepers; A3 kitchen-sink losers off.
# VUS/GATE off; policy: static; early_stop: val_loss.
seed: 111
seeds: [111, 222, 333, 444, 555]

paths:
  adbench_root: ../ADBench/adbench/datasets
  results_dir: results/adadae4_final
  run_id: adadae4_final

train:
  setting: semi-supervised
  lr: 0.001
  epochs: 100
  eval_every: 10
  early_stop_patience: 30
  val_fraction: 0.2
  early_stop_metric: val_loss
  contrastive: true
  contrastive_alpha: 0.15
  contrastive_alpha_unsupervised: 0.05
  hard_negative_mining: true
  contrastive_gamma: 1.0
  contrastive_adaptive_alpha: true

model:
  hidden_dims: [512, 512]
  latent_dim: 32
  activation: lrelu

diffusion:
  num_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  scheduler: linear
  time_emb_dim: 4
  time_emb_type: sinusoidal

adadae:
  policy: static
  use_danc: true
  use_chronos: true
  chronos_hidden: 32
  chronos_in_dim: 16
  use_scs: true
  use_ftp: true
  use_multiview: true
  scs_max_timesteps: 64
  scs_mode: snr_weighted
  scs_selection: snr_stratified
  danc_contamination_mode: label_free
  contrastive_pairing: taps
  use_uncertainty_view: false
  use_dte_view: true
  dte_knn: 5
  dte_memory_size: 4096
  dte_knn_weight: 0.5
  use_rejection_training: true
  rejection_quantile: 0.95
  rejection_min_weight: 0.1
  rejection_warmup_epochs: 1
  use_geode: true
  geode_neighbors: 32
  geode_components: 4
  use_aether: true
  aether_loss_weight: 0.1
  use_nexus: false
  # A3 keepers (post-triage)
  use_helios: true
  use_kairos: true
  use_orbis: true
  use_plexus: true
  use_nexus_v2: true
  nexus_loss_weight: 0.05
  use_rdt_v2: true
  use_epoche: true
  use_mirage: false
  use_aegis: false
  use_flux: false
  use_atlas: false
  # AdaDDAE-4
  use_omni: true
  auto_regime_gates: true
  use_nano: true
  use_torrent: true
  use_prism: true
  use_polis: true
  use_sieve: true
  use_needle: true
  use_sparse_view: true
  use_robust: true
  use_quell: true
  fusion_mode: quell
  use_mce: false
  use_gate: false
  fusion_weights:
    reconstruction: 0.28
    latent: 0.12
    residual: 0.08
    diffusion_time: 0.12
    geode: 0.12
    aether: 0.1
    orbis: 0.05
    plexus: 0.05
    prism: 0.08
    polis: 0.05
    sparse: 0.03
    sieve: 0.04

features:
  scaler: auto
  pca_dim_threshold: 128
  pca_max_components: 128
  pca_variance: 0.95
  clip_outliers: true
  clip_sigma: 5.0

hardware: hardware_rtx5070ti.yaml
