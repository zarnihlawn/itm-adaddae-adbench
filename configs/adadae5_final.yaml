# AdaDDAE-5 Table 5 — information-geometric breakthrough stack.
# Base = AdaDDAE Table-1 integrity core + lean A5 modules (not A3/A4 kitchen-sink).
# Protocol knobs locked to fair DDAE (assert_final_config).
seed: 111
seeds: [111, 222, 333, 444, 555]

paths:
  adbench_root: ../ADBench/adbench/datasets
  results_dir: results/adadae5_final
  run_id: adadae5_final

train:
  setting: semi-supervised
  lr: 0.001
  epochs: 100
  eval_every: 10
  early_stop_patience: 30
  val_fraction: 0.2
  early_stop_metric: val_loss
  contrastive: true
  contrastive_alpha: 0.15
  contrastive_alpha_unsupervised: 0.05
  hard_negative_mining: true
  contrastive_gamma: 1.0
  contrastive_adaptive_alpha: true

model:
  hidden_dims: [512, 512]
  latent_dim: 32
  activation: lrelu

diffusion:
  num_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  scheduler: linear
  time_emb_dim: 4
  time_emb_type: sinusoidal

adadae:
  policy: static
  use_danc: true
  use_scs: true
  use_ftp: true
  use_multiview: true
  scs_max_timesteps: 64
  scs_mode: snr_weighted
  scs_selection: snr_stratified
  scs_full_sum_ablation: false
  danc_contamination_mode: label_free
  contrastive_pairing: taps
  use_uncertainty_view: true
  uncertainty_draws: 3
  use_dte_view: true
  dte_knn: 5
  dte_memory_size: 4096
  dte_knn_weight: 0.5
  use_rejection_training: true
  rejection_quantile: 0.95
  rejection_min_weight: 0.1
  rejection_warmup_epochs: 1
  fusion_mode: lexicon
  use_mce: false
  use_gate: false
  fusion_weights:
    reconstruction: 0.36
    latent: 0.16
    residual: 0.12
    uncertainty: 0.08
    diffusion_time: 0.14
    mahala: 0.10
    sinkhorn: 0.04

  # AdaDDAE-2/3/4 specialists off by default; GEODE/ORBIS via auto_regime_gates
  use_chronos: false
  use_geode: false
  use_aether: false
  use_nexus: false
  use_helios: false
  use_kairos: false
  use_orbis: false
  use_omni: false
  auto_regime_gates: true

  # Wave 1 — ON
  use_figaro: true
  use_dsm_plus: true
  dsm_plus_lambda: 0.5
  use_mahala: true
  use_full_dte: true
  use_lexicon: true

  # Wave 2 — lean ON (SPECTRA/SINKHORN on; demote via triage if smoke regresses)
  use_pura: true
  use_evt_tail: true
  use_confal: true
  use_spectra: true
  spectra_components: 8
  use_sinkhorn: true

  # Wave 3 — ELBO demoted (was residual clone in fusion); keep curriculum/vMF/IB
  use_ib_latent: true
  ib_latent_beta: 0.01
  use_elbo_s: false
  use_curriculum_snr: true
  use_vmf_z: true
  vmf_kappa: 1.0

features:
  scaler: auto
  pca_dim_threshold: 128
  pca_max_components: 128
  pca_variance: 0.95
  clip_outliers: true
  clip_sigma: 5.0

hardware: hardware_rtx5070ti.yaml
