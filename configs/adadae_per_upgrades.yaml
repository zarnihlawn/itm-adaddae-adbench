# AdaDDAE-PER v5.1 additive upgrades (applied on top of routed base policy).
# Source: configs/policy_registry_v5.yaml + scripts/run_gate_protocol.sh +
#         scripts/run_adadae_v51_protocol.sh (MCE/SMC/GATE tracks).
version: "5.1"
description: >
  Single-pass encoding of the v5.1 hybrid rule stack: v4.1 routed base
  + MCE modality targets + SMC semi tails + GATE v2 winners.
  Semi-NLP MCE is blocked (historical regressions).

mce:
  # dataset -> modality (classical | cv | nlp)
  cv:
    - ALOI
    - celeba
    - CIFAR10
    - SVHN
    - speech
  nlp:
    - Imdb
    - Agnews
    - Amazon
    - Yelp
    - 20newsgroups
  classical:
    - optdigits
    - cover
  # Never enable MCE on semi-supervised NLP (mce_block_semi_nlp)
  block_semi_nlp: true

smc:
  # semi-supervised only
  semi:
    - glass
    - vertebral
    - Waveform
    - speech

gate:
  # GATE v2: proven unsup winners only (exclude cover/celeba disasters)
  unsupervised:
    - speech
    - ALOI
    - optdigits
  semi-supervised: []
