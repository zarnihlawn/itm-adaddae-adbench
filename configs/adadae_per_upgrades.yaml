# AdaDDAE-PER additive upgrades (applied on top of routed base policy).
# Source: v5.1 MCE/SMC/GATE + Loop-2 surgery + Loop-7 selective A6.
version: "5.1-loop2"
description: >
  Single-pass PER stack: routed base + selective MCE/SMC/GATE + optional A6.
  Semi-NLP MCE blocked. Loop-2: glass/vertebral removed from SMC (hurt vs fair);
  CIFAR10 removed from MCE CV (hurt vs fair). Loop-7: A6 flags per-dataset.

mce:
  cv:
    - ALOI
    - celeba
    # CIFAR10 removed — blind mce_cv regressed vs fair DDAE on semi
    - SVHN
    - speech
  nlp:
    - Imdb
    - Agnews
    - Amazon
    - Yelp
    - 20newsgroups
  classical:
    - optdigits
    - cover
  block_semi_nlp: true

smc:
  # semi-supervised only — glass/vertebral removed (PER mean < fair)
  semi:
    - Waveform
    - speech

gate:
  unsupervised:
    - speech
    - ALOI
    - optdigits
  semi-supervised: []

# Loop 7: selective A6 modules (default off unless listed).
# Applied only when dataset is listed under the module key for that setting.
a6:
  nautilus:
    # tiny-n classical
    semi-supervised:
      - glass
      - wine
      - Hepatitis
      - vertebral
    unsupervised: []
  apex:
    semi-supervised:
      - speech
      - fraud
      - smtp
      - cover
    unsupervised: []
  orbit:
    semi-supervised:
      - SVHN
      - speech
    unsupervised: []
  ridge:
    semi-supervised:
      - SpamBase
      - satellite
      - yeast
    unsupervised: []
  delta:
    semi-supervised:
      - speech
      - fraud
    unsupervised: []
