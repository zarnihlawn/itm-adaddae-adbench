  - Agnews
  - Amazon
  - Imdb
  - Yelp
  - 20newsgroups
  - thyroid
  - optdigits
  - backdoor
  # Calibrated fusion on proven Waveform-class / mid-tier wins
  calibrated_fusion_semi:
