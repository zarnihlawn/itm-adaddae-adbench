# DDAE-comparable ablation: disable AdaDDAE extras
seed: 111
seeds: [111, 222, 333, 444, 555]

paths:
  adbench_root: ../ADBench/adbench/datasets
  results_dir: results
  run_id: ddae_baseline

train:
  setting: semi-supervised
  lr: 0.001
  epochs: 100
  eval_every: 10
  early_stop_patience: 30
  val_fraction: 0.2
  early_stop_metric: val_loss
  contrastive: false
  contrastive_alpha: 0.0
  hard_negative_mining: false

model:
  hidden_dims: [512, 512]
  latent_dim: 32
  activation: lrelu

diffusion:
  num_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  scheduler: linear
  time_emb_dim: 4
  time_emb_type: sinusoidal

adadae:
  policy: static
  use_danc: false
  use_scs: false
  use_ftp: false
  use_multiview: false
  scs_max_timesteps: 50
  fusion_weights:
    reconstruction: 1.0
    latent: 0.0
    residual: 0.0

features:
  scaler: standard
  pca_dim_threshold: 99999
  pca_max_components: 128
  pca_variance: 0.95
  clip_outliers: false
  clip_sigma: 5.0

hardware: hardware_cpu.yaml
